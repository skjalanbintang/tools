<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#043d2f">
<title>eKOKU – Laporan Perjumpaan Kokurikulum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --zam-950:#022a20;--zam-900:#043d2f;--zam-800:#06513d;--zam-700:#067a58;--zam-600:#0a9468;--zam-500:#12b37f;--zam-300:#7fdcb8;--zam-100:#d5f3e6;--zam-50:#eef9f4;
  --bg:#f2f8f5;--card:#fff;--ink:#0c2a22;--mut:#58766c;--line:#d9e8e1;--line2:#e7f1ec;
  --gold:#a87a10;--gold-bg:#fbf1d6;--rose:#be3455;--rose-bg:#fde8ed;
  --ring:rgba(18,179,127,.3);--sh:0 1px 2px rgba(4,61,47,.06),0 10px 26px -14px rgba(4,61,47,.22);
  --fd:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme=dark]{--bg:#07150f;--card:#0d221a;--ink:#e3f4ec;--mut:#8db3a5;--line:#1b3a2e;--line2:#143026;--zam-50:#0f2b21;--zam-100:#14402f;--gold:#e3b64a;--gold-bg:#3a2f10;--rose:#f08aa2;--rose-bg:#3b1621;--sh:0 1px 2px #0006,0 10px 26px -14px #000b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.ic{flex:none}
:focus-visible{outline:2px solid var(--zam-500);outline-offset:2px}
[hidden]{display:none!important}
small,.mut{color:var(--mut)}
/* boot + login */
#boot{position:fixed;inset:0;background:var(--zam-950);display:grid;place-items:center;color:#cdeee0;z-index:100;text-align:center;padding:20px}
#boot .pulse{width:46px;height:46px;border-radius:14px;background:var(--zam-500);margin:0 auto 16px;animation:pulse 1.2s ease-in-out infinite}
#boot p{margin:0;max-width:420px}#boot .err{color:#ffb4c2;margin-top:12px}
@keyframes pulse{50%{transform:scale(.8);opacity:.6}}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1100px 560px at 12% -5%,#0a6a4c66,transparent 60%),radial-gradient(700px 420px at 100% 100%,#06513d88,transparent 60%),var(--zam-950)}
.lcard{width:min(410px,100%);background:var(--card);border-radius:22px;padding:32px 30px;box-shadow:0 40px 90px -30px #000c}
.lcard .logo{margin-bottom:14px}.lcard h1{font-size:30px;font-weight:800}.lcard p{margin:4px 0 18px;color:var(--mut)}
.lerr{color:var(--rose);min-height:20px;margin:10px 0 0;font-size:13px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--zam-500);display:grid;place-items:center;color:#032b20}
/* shell */
#app{display:none}body.in #app{display:block}
aside{position:fixed;inset:0 auto 0 0;width:256px;background:linear-gradient(180deg,var(--zam-900),var(--zam-950));color:#bfe6d6;display:flex;flex-direction:column;padding:16px 12px;z-index:40;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.brand b{font:800 18px var(--fd);color:#fff;display:block;line-height:1.1}
.brand small{font-size:11.5px;color:#86cdb0;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
#nav a{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:#bfe6d6;font-weight:500;position:relative;transition:background .15s,color .15s}
#nav a:hover{background:#ffffff12;color:#fff}
#nav a.on{background:#ffffff1a;color:#fff}
#nav a.on:before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--zam-300)}
.me{margin-top:auto;padding:10px;border-radius:14px;background:#ffffff0f}
.me .row{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--zam-300);color:#043d2f;display:grid;place-items:center;font-weight:700;flex:none}
.me b{color:#fff;display:block;font-size:13px;line-height:1.2}.me small{color:#86cdb0}
.me .acts{display:flex;gap:6px;margin-top:10px}
.me .acts button{flex:1;background:#ffffff14;border:0;border-radius:8px;padding:6px 8px;color:#d9f4e8;font-size:12px;display:flex;gap:6px;align-items:center;justify-content:center}
.me .acts button:hover{background:#ffffff24}
main{margin-left:256px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.top .sp{flex:1}.top .sch{font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn:hover{border-color:var(--zam-500)}
.qs{display:flex;gap:8px;align-items:center;padding:0 12px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.qs:hover{border-color:var(--zam-500)}.qs kbd{font:600 11px var(--fb);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
#menu{display:none}
#scrim{display:none}
#main{padding:26px 24px 60px;max-width:1180px;margin:0 auto}
.view.enter{animation:rise .34s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* page header */
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:28px;font-weight:800}.ph p{margin:4px 0 0;color:var(--mut)}
.pa{display:flex;gap:8px;flex-wrap:wrap}
/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--zam-600);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--zam-700)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--zam-50);border-color:var(--zam-500)}
.btn.soft{background:var(--zam-100);color:var(--zam-800)}[data-theme=dark] .btn.soft{color:var(--zam-300)}
.btn.soft:hover{background:var(--zam-300);color:#043d2f}
.btn.danger{background:var(--rose);color:#fff}[data-theme=dark] .btn.danger{color:#3b1621}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ic-only{padding:6px 8px}
.btn:disabled{opacity:.5;pointer-events:none}
.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
.in:focus{outline:0;border-color:var(--zam-500);box-shadow:0 0 0 3px var(--ring)}
textarea.in{resize:vertical;min-height:84px}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 11px;color:var(--mut);flex:1;min-width:170px}
.srch:focus-within{border-color:var(--zam-500);box-shadow:0 0 0 3px var(--ring)}
.srch input{border:0;background:transparent;padding:9px 0;width:100%;color:var(--ink);font:inherit;outline:0}
.f{margin-bottom:12px}.f>label{display:block;font-weight:600;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools .in{width:auto;min-width:150px;flex:0 1 auto}
.tabs{display:inline-flex;gap:3px;background:var(--line2);padding:4px;border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--mut);display:flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tabs b{background:var(--zam-100);color:var(--zam-800);border-radius:99px;padding:0 7px;font-size:11.5px}[data-theme=dark] .tabs b{color:var(--zam-300)}
/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.card>h3{font-size:17px;margin-bottom:12px}
.wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr{transition:background .12s}.tbl tbody tr:hover{background:var(--zam-50)}
.tbl td.r,.tbl th.r{text-align:right}.tbl td.c,.tbl th.c{text-align:center}
.tbl .nm b{display:block;font-weight:600}.tbl .nm small{font-size:12px}
.acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--zam-100);color:var(--zam-800);font-size:12px;font-weight:600;white-space:nowrap}[data-theme=dark] .badge{color:var(--zam-300)}
.badge.gold{background:var(--gold-bg);color:var(--gold)}.badge.rose{background:var(--rose-bg);color:var(--rose)}.badge.gray{background:var(--line2);color:var(--mut)}
.kt{--kc:#0a8a7a;display:inline-block;padding:2px 9px;border-radius:7px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc);white-space:nowrap}
.k-BB{--kc:#0a8a7a}.k-KP{--kc:#3b72b8}.k-SP{--kc:#b0720f}.k-RS{--kc:#b4486a}
[data-theme=dark] .k-BB{--kc:#4fd1bd}[data-theme=dark] .k-KP{--kc:#7fb0ee}[data-theme=dark] .k-SP{--kc:#efb757}[data-theme=dark] .k-RS{--kc:#f08aa2}
.bar{height:8px;border-radius:9px;background:var(--line2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.3,.7,.2,1)}
.empty{text-align:center;padding:38px 16px;color:var(--mut)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:4px}.empty p{margin:0 0 14px}
.ok{color:var(--zam-600);font-weight:700}.no{color:var(--rose);font-weight:700}.na{color:var(--mut)}
.cellbtn{border:0;background:transparent;padding:2px 8px;border-radius:7px}.cellbtn:hover{background:var(--rose-bg)}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;background:radial-gradient(600px 300px at 100% 0,#12b37f44,transparent 65%),linear-gradient(135deg,var(--zam-800),var(--zam-950));color:#e6f8f0;border-radius:22px;padding:26px 28px;margin-bottom:16px;box-shadow:var(--sh)}
.hero h1{font-size:30px;font-weight:800;color:#fff}.hero p{margin:4px 0 0;color:#a9dcc6}
.hero .rg{display:flex;align-items:center;gap:18px;margin-top:20px}
.hero .rg .t{position:relative;display:grid;place-items:center}.hero .rg .t div{position:absolute;text-align:center;font:800 28px var(--fd);color:#fff;line-height:1}.hero .rg .t div small{display:block;font:500 11px var(--fb);color:#a9dcc6;margin-top:2px}
.hero .rg span{max-width:190px;color:#c6ecda}
.ring .v{transition:stroke-dashoffset 1.1s cubic-bezier(.25,.8,.25,1)}
.gen .row{margin-bottom:14px}.gen .row div{display:flex;justify-content:space-between;margin-bottom:5px;font-weight:600}
.gen .bar{background:#ffffff22}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
button.tile:hover{transform:translateY(-2px);border-color:var(--zam-500)}
.tile .i{width:40px;height:40px;border-radius:11px;background:var(--zam-100);color:var(--zam-700);display:grid;place-items:center;flex:none}[data-theme=dark] .tile .i{color:var(--zam-300)}
.tile b{font:800 24px var(--fd);display:block;line-height:1.1}.tile span{color:var(--mut);font-size:12.5px}
.tile.gold .i{background:var(--gold-bg);color:var(--gold)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}.feed li:last-child{border:0}
.feed .d{width:8px;height:8px;border-radius:50%;background:var(--zam-500);margin-top:7px;flex:none}.feed .d.p{background:var(--gold)}
.ubar{display:grid;grid-template-columns:150px 1fr 44px;gap:12px;align-items:center;padding:8px 0}
.ubar b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* cards (program, unit, ekstra) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.pc:hover{border-color:var(--zam-500)}
.pc .top2{display:flex;gap:6px;flex-wrap:wrap}.pc h3{font-size:18px;margin-top:4px}.pc p{margin:0;color:var(--mut)}
.pc .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:4px}.pc .meta span{display:flex;gap:5px;align-items:center}
.pc .acts{margin-top:auto;padding-top:12px;justify-content:flex-start;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--zam-500)}.chip.on{border-color:var(--zam-600);background:var(--zam-50);box-shadow:0 0 0 3px var(--ring)}
.chip small{font-size:12px}
.sec{margin:18px 0 8px;font:700 15px var(--fd);display:flex;gap:8px;align-items:center}
/* dialog */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 40px 90px -20px #000b;overflow:hidden}
dialog[open]{animation:pop .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
dialog.out{animation:popout .14s ease-in forwards}
dialog.wide{width:min(820px,95vw)}
dialog::backdrop{background:#021a13aa;backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes popout{to{opacity:0;transform:translateY(8px) scale(.98)}}
.mh{display:flex;justify-content:space-between;gap:12px;padding:20px 22px 8px}.mh h3{font-size:20px}.mh p{margin:2px 0 0;color:var(--mut)}
.mh .x{border:0;background:var(--line2);width:32px;height:32px;border-radius:9px;flex:none}
.mb{padding:10px 22px 6px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 20px;flex-wrap:wrap}
.steps{display:flex;gap:8px;margin-bottom:14px}.steps span{flex:1;padding:8px 12px;border-radius:10px;background:var(--line2);color:var(--mut);font-weight:600;font-size:13px}.steps span.on{background:var(--zam-100);color:var(--zam-800)}[data-theme=dark] .steps span.on{color:var(--zam-300)}
.pick-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.pick-bar .n{margin-left:auto;font-weight:600;color:var(--zam-700)}[data-theme=dark] .pick-bar .n{color:var(--zam-300)}
.pick-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}
.pk{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}.pk:hover{background:var(--zam-50)}.pk[hidden]{display:none}
.pk input{width:16px;height:16px;accent-color:var(--zam-600);flex:none}.pk small{display:block;font-size:12px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0 0 14px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:500}
.pf{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--zam-800),var(--zam-950));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.pf .av{width:54px;height:54px;font-size:22px;background:var(--gold-bg);color:var(--gold)}.pf h3{color:#fff}.pf small{color:#a9dcc6}
.pf .n{display:flex;gap:18px;margin-left:auto;text-align:center}.pf .n b{display:block;font:800 22px var(--fd)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--zam-900);color:#e6f8f0;padding:10px 16px;border-radius:12px;box-shadow:0 12px 30px -10px #000a;animation:pop .25s;max-width:340px}
.toast.err{background:var(--rose);color:#fff}[data-theme=dark] .toast.err{color:#3b1621}
.alert{background:var(--gold-bg);color:var(--gold);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:500}
.qr{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto;margin-top:8px}
.qr button{display:flex;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px}
.qr button:hover,.qr button.on{background:var(--zam-50)}.qr small{margin-left:auto}
.editrow{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:8px}
@media(max-width:900px){
  aside{transform:translateX(-100%)}body.nav-open aside{transform:none}
  #scrim{display:block;position:fixed;inset:0;background:#021a1388;z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
  body.nav-open #scrim{opacity:1;pointer-events:auto}
  main{margin-left:0}#menu{display:grid}.top{padding:10px 14px}#main{padding:18px 14px 60px}
  .hero{grid-template-columns:1fr}.two{grid-template-columns:1fr}.qs span,.qs kbd{display:none}.qs{padding:0 10px}
}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:10px;gap:9px}.tile .i{width:34px;height:34px}.tile b{font-size:20px}.tools .in,.tools .srch{flex:1 1 100%}.g2,.g3{grid-template-columns:1fr}.pick-list{grid-template-columns:1fr}.ph h1{font-size:23px}.ubar{grid-template-columns:100px 1fr 36px}.pf{flex-wrap:wrap}.pf .n{margin:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="boot"><div><div class="pulse"></div><p id="bootmsg">Menyambung ke pangkalan data…</p><p class="err" id="booterr"></p></div></div>

<div id="login" hidden>
  <form class="lcard" onsubmit="doLogin(event)">
    <div class="logo" id="lg-logo"></div>
    <h1>eKOKU</h1>
    <p id="lg-school">Laporan perjumpaan kokurikulum</p>
    <div class="f"><label for="lg-user">Nama guru</label><select class="in" id="lg-user" required></select></div>
    <div class="f"><label for="lg-pw">Kata laluan</label><input class="in" id="lg-pw" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:6px">Log masuk</button>
    <div class="lerr" id="lg-err" role="alert"></div>
    <small id="lg-mode"></small>
  </form>
</div>

<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo" id="side-logo"></div><div><b>eKOKU</b><small id="side-school"></small></div></div>
    <nav id="nav" aria-label="Menu utama"></nav>
    <div class="me">
      <div class="row"><div class="av" id="me-av"></div><div><b id="me-n"></b><small id="me-r"></small></div></div>
      <div class="acts"><button onclick="pwModal(false)" id="b-pw"></button><button onclick="logout()" id="b-out"></button></div>
    </div>
  </aside>
  <div id="scrim" onclick="document.body.classList.remove('nav-open')"></div>
  <main>
    <header class="top">
      <button class="iconbtn" id="menu" onclick="document.body.classList.add('nav-open')" aria-label="Buka menu"></button>

/* =============== stor data (Firestore atau mod demo) =============== */

const FB=!!(FBC.apiKey&&FBC.projectId&&window.firebase);

let CFG=withDef(),ver=0,fdb=null,booted=false,ME=null;const loaded=new Set();
const get=(c,id)=>IDX[c].get(id);
function setCol(c,arr){S[c]=arr;IDX[c]=new Map(arr.map(x=>[x.id,x]));ver++}
const lsKey=c=>'ekoku_'+c;
function localPersist(c){try{localStorage.setItem(lsKey(c),JSON.stringify(S[c]))}catch{}}
function save(c,o){
  const id=o.id||(FB?fdb.collection(c).doc().id:newId());const d=clean(o);delete d.id;
  if(FB)return fdb.collection(c).doc(id).set(d).then(()=>id);
  const rec={...d,id},arr=S[c].slice(),i=arr.findIndex(x=>x.id===id);i<0?arr.push(rec):arr[i]=rec;
  setCol(c,arr);localPersist(c);schedule();return Promise.resolve(id)
}
async function saveMany(c,list){
  if(!list.length)return;
  if(FB){for(let i=0;i<list.length;i+=400){const b=fdb.batch();list.slice(i,i+400).forEach(o=>{const id=o.id||fdb.collection(c).doc().id,d=clean(o);delete d.id;b.set(fdb.collection(c).doc(id),d)});await b.commit()}return}
  const arr=S[c].slice();list.forEach(o=>{const id=o.id||newId(),rec={...clean(o),id},i=arr.findIndex(x=>x.id===id);i<0?arr.push(rec):arr[i]=rec});
  setCol(c,arr);localPersist(c);schedule()
}
async function removeMany(c,ids){
  if(!ids.length)return;
  if(FB){for(let i=0;i<ids.length;i+=400){const b=fdb.batch();ids.slice(i,i+400).forEach(id=>b.delete(fdb.collection(c).doc(id)));await b.commit()}return}
  const s=new Set(ids);setCol(c,S[c].filter(x=>!s.has(x.id)));localPersist(c);schedule()
}
const remove=(c,id)=>removeMany(c,[id]);
function saveCfg(p){
  CFG={...CFG,...p};ver++;
  if(FB)return fdb.collection('tetapan').doc('umum').set(clean(CFG));
  try{localStorage.setItem(lsKey('cfg'),JSON.stringify(CFG))}catch{}
  schedule();return Promise.resolve()
}
const run=(p,ok)=>Promise.resolve(p).then(()=>ok&&toast(ok)).catch(e=>toast('Tidak berjaya: '+(e.message||e),'err'));
function dbError(err){
  const m=err&&err.code==='permission-denied'?'Firestore menolak akses. Semak Security Rules dan Anonymous sign-in (lihat README).':'Gagal menyambung ke Firebase: '+(err&&err.message||err);
  $('#booterr').textContent=m;if(booted)toast(m,'err')
}
function mark(c){loaded.add(c);if(loaded.size>=COLS.length+1)boot()}
function connect(){
  if(!FB){
    COLS.forEach(c=>{try{setCol(c,JSON.parse(localStorage.getItem(lsKey(c))||'[]'))}catch{setCol(c,[])}});
    try{CFG=withDef(JSON.parse(localStorage.getItem(lsKey('cfg'))||'{}'))}catch{}
    seedDemo().then(boot);return
  }
  firebase.initializeApp(FBC);fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch{}
  const au=firebase.auth?firebase.auth().signInAnonymously().catch(()=>{}):Promise.resolve();
  au.then(()=>{
    COLS.forEach(c=>fdb.collection(c).onSnapshot(s=>{
      setCol(c,s.docs.map(d=>({...d.data(),id:d.id})));
      if(c==='guru'&&!s.size&&!s.metadata.fromCache)seedAdmin();
      mark(c);schedule()
    },dbError));
    fdb.collection('tetapan').doc('umum').onSnapshot(d=>{CFG=withDef(d.exists?d.data():{});ver++;mark('cfg');schedule()},dbError)
  });
  setTimeout(()=>{if(!booted&&!$('#booterr').textContent)$('#booterr').textContent='Sambungan lambat. Semak config Firebase dan sambungan internet.'},9000)
}
async function adminRec(){const salt=rnd();return {nama:'Pentadbir Sistem',nokp:'',peranan:'admin',salt,hash:await sha(salt+'admin123'),tukar:true}}

  const ref=fdb.collection('guru').doc('admin'),rec=await adminRec();
  try{await fdb.runTransaction(async t=>{const d=await t.get(ref);if(!d.exists)t.set(ref,rec)})}catch{}
}
async function seedDemo(){
  if(S.guru.length)return;
  await save('guru',{...(await adminRec()),id:'admin'});
  await seedSample()
}

  W=['Nurul Aisyah binti Hamid','Siti Balqis binti Azman','Aina Sofea binti Roslan','Farah Nadhirah binti Idris','Alya Qistina binti Rahim','Hanis Zulaikha binti Jamal','Mira Syuhada binti Omar','Izzah Najwa binti Samad','Wardah Hanani binti Nasir'],
  ms=[...L.map(n=>[n,'Lelaki']),...W.map(n=>[n,'Perempuan'])].map(([nama,jantina],i)=>({id:newId(),nama,jantina,nokp:'1'+String(i+1).padStart(5,'0')+'0'+String(100+i*7)+'01',tingkatan:'Tingkatan '+(1+i%3),kelas:['Amanah','Bestari'][i%2],u:{BB:at('BB')[i%2].id,KP:at('KP')[i%3].id,SP:at('SP')[i%2].id,RS:at('RS')[i%3].id}}));
  await saveMany('murid',ms);
  const in1=ms.filter(m=>m.u.BB===at('BB')[0].id),t0=new Date();const dd=n=>{const d=new Date(t0);d.setDate(d.getDate()-n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  await saveMany('perjumpaan',[1,2].map(b=>({id:newId(),unitId:at('BB')[0].id,bil:b,tarikh:dd(21-b*7),mula:'14:30',tamat:'16:00',tempat:'Padang sekolah',aktiviti:b===1?'Latihan asas kawad kaki':'Pembinaan khemah',ringkasan:'Perjumpaan berjalan lancar. Semua ahli mengikuti latihan mengikut jadual.',hadir:in1.slice(0,in1.length-b+1).map(m=>m.id)})));

  await saveMany('program',[pr,{id:newId(),nama:'Perkhemahan Unit Beruniform',kategori:'BB',unitId:at('BB')[0].id,peringkat:'Sekolah',mula:dd(-12),tamat:dd(-14),tempat:'Kem Hutan Lipur',penganjur:'Unit PENGAKAP',guruIds:[],pesertaIds:in1.map(m=>m.id),status:'daftar'}]);
  await save('jawatan',{unitId:at('BB')[0].id,muridId:in1[0].id,jawatan:'Pengerusi'})

  $('#lg-mode').textContent=FB?'Disambung ke Firebase':FBC.apiKey?'Config Firebase ditemui tetapi pustaka Firebase gagal dimuatkan. Semak sambungan internet, kemudian muat semula.':'Mod demo: data disimpan dalam pelayar ini sahaja.'
}
async function doLogin(e){
  e.preventDefault();const g=get('guru',$('#lg-user').value),err=$('#lg-err');err.textContent='';
  if(!g){err.textContent='Pilih nama guru.';return}
  try{
    if(g.hash!==await sha((g.salt||'')+$('#lg-pw').value)){err.textContent='Kata laluan tidak betul.';return}
  }catch{err.textContent='Pelayar ini tidak menyokong log masuk selamat. Buka eKOKU melalui https.';return}
  ME=g;try{sessionStorage.setItem('ekoku_uid',g.id)}catch{}$('#lg-pw').value='';enterApp()
}

  $('#login').hidden=true;document.body.classList.add('in');ENTER=true;routeChange();

}

  const d=$('#dlg');clearTimeout(MS.ct);d.classList.remove('out');d.classList.toggle('wide',wide);

/* =============== statistik (dikira sekali bagi setiap perubahan data) =============== */
let memo={ver:-1};
function stats(){
  if(memo.ver===ver)return memo;
  const M=new Map(),mem=new Map(),byUnit=new Map();
  const g=id=>{let s=M.get(id);if(!s){s={total:0,byKat:{},ach:[],prog:[],jaw:[],eks:[],hadir:0,mtg:0};M.set(id,s)}return s};
  const add=(s,k,n)=>{s.total+=n;if(k)s.byKat[k]=(s.byKat[k]||0)+n};
  for(const m of S.murid){g(m.id);for(const uid of new Set(Object.values(m.u||{}))){if(!get('unit',uid))continue;(mem.get(uid)||mem.set(uid,[]).get(uid)).push(m)}}
  for(const j of S.jawatan){if(!get('murid',j.muridId))continue;const s=g(j.muridId);s.jaw.push(j);add(s,get('unit',j.unitId)?.kategori,markJaw(j.jawatan))}
  for(const p of S.program){const done=p.status==='selesai';for(const id of p.pesertaIds||[]){if(!get('murid',id))continue;const s=g(id);s.prog.push(p);if(done){add(s,p.kategori,markPer(p.peringkat));const h=p.laporan?.hasil?.[id];if(AWARD.includes(h))s.ach.push({muridId:id,tajuk:p.nama,peringkat:p.peringkat,hasil:h,tarikh:p.tamat,unitId:p.unitId,kategori:p.kategori})}}}
  for(const a of S.pencapaian){if(get('murid',a.muridId))g(a.muridId).ach.push({...a,kategori:get('unit',a.unitId)?.kategori})}
  for(const e of S.ekstra)for(const id of e.muridIds||[])if(get('murid',id))g(id).eks.push(e);
  for(const t of S.perjumpaan)(byUnit.get(t.unitId)||byUnit.set(t.unitId,[]).get(t.unitId)).push(t);
  for(const [uid,ms] of mem){const ts=byUnit.get(uid)||[];for(const m of ms){const s=g(m.id);s.mtg+=ts.length;s.hadir+=ts.filter(t=>(t.hadir||[]).includes(m.id)).length}}
  memo={ver,M,mem,byUnit};return memo
}
const pctOf=s=>s&&s.mtg?Math.round(s.hadir/s.mtg*100):null;
const membersOf=id=>stats().mem.get(id)||[];

function tbl(heads,rows,emptyHtml){

}

function ring(p,sz=120,sw=12,col='var(--zam-300)',trk='rgba(255,255,255,.16)'){

}

  const need=S.unit.length*N,pct=need?Math.round(done/need*100):0,first=(ME.nama||'').split(' ')[0];

  <div class="stats">

   <button class="tile" onclick="location.hash='#/jawatan'"><span class="i">${ic('badge')}</span><div><b>${S.unit.length}</b><span>Unit kokurikulum</span></div></button>

function mtgMatrix(){
  const v=V(),N=CFG.bilPerjumpaan,us=S.unit.filter(u=>!v.kat||u.kategori===v.kat).sort((a,b)=>KK.indexOf(a.kategori)-KK.indexOf(b.kategori)||byNama(a,b));
  const rows=us.map(u=>{const set=new Set(S.perjumpaan.filter(t=>t.unitId===u.id).map(t=>+t.bil)),n=Math.min(N,[...set].filter(b=>b<=N).length);return {u,set,n}});

/* ---------- Kehadiran ---------- */
function kehKat(k){const v=V();v.kat=k;v.unit='';schedule()}
function vKehadiran(){
  const v=V(),kat=v.kat||'BB',us=S.unit.filter(u=>u.kategori===kat).sort(byNama),{M,byUnit}=stats(),uid=us.find(u=>u.id===v.unit)?v.unit:((us.find(u=>(byUnit.get(u.id)||[]).length)||us[0])?.id||'');
  const ts=(byUnit.get(uid)||[]).slice().sort((a,b)=>a.bil-b.bil),byBil=new Map(ts.map(t=>[+t.bil,t])),maxB=Math.max(CFG.bilPerjumpaan,...ts.map(t=>+t.bil),0),cols=Array.from({length:maxB},(_,i)=>i+1);
  const all=membersOf(uid),tings=[...new Set(all.map(kelasOf))].sort(),q=(v.q||'').toLowerCase();
  const ms=all.filter(m=>(!v.kls||kelasOf(m)===v.kls)&&(!q||(m.nama+' '+m.nokp).toLowerCase().includes(q))).sort(byNama);
  const pcts=ms.map(m=>pctOf(M.get(m.id))).filter(x=>x!=null),avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):0,full=pcts.filter(x=>x===100).length;
  const head=pageHead('Kehadiran perjumpaan','Matriks kehadiran murid bagi setiap perjumpaan unit.',`<button class="btn ghost" onclick="exportKeh('${uid}')">${ic('down',16)}Muat turun CSV</button>`);
  return head+`<div class="card"><div class="tools"><select class="in" onchange="kehKat(this.value)" aria-label="Kategori">${katOpts().map(([a,b])=>`<option value="${a}"${a===kat?' selected':''}>${b}</option>`).join('')}</select><select class="in" onchange="T('unit',this.value)" aria-label="Unit">${us.map(u=>`<option value="${u.id}"${u.id===uid?' selected':''}>${esc(u.nama)}</option>`).join('')}</select>${fSel('kls',tings,'Semua kelas')}${qIn('Cari nama atau No. KP')}</div>
  <div class="stats" style="margin:0 0 14px"><div class="tile"><span class="i">${ic('users')}</span><div><b>${all.length}</b><span>Jumlah murid</span></div></div><div class="tile"><span class="i">${ic('check')}</span><div><b>${avg}%</b><span>Purata hadir</span></div></div><div class="tile"><span class="i">${ic('clip')}</span><div><b>${ts.length}</b><span>Perjumpaan direkod</span></div></div><div class="tile gold"><span class="i">${ic('badge')}</span><div><b>${full}</b><span>Hadir penuh</span></div></div></div>`+
  tbl(['Bil','Nama',...cols.map(c=>'c:'+c),'c:Hadir','c:%'],ms.map((m,i)=>{const s=M.get(m.id),p=pctOf(s);return [i+1,`<div class="nm"><b>${esc(m.nama)}</b><small>${esc(kelasOf(m))}</small></div>`,...cols.map(b=>{const t=byBil.get(b);return !t?'<span class="na">–</span>':(t.hadir||[]).includes(m.id)?'<span class="ok">✓</span>':'<span class="no">✗</span>'}),s?`${s.hadir} / ${s.mtg}`:'-',p==null?'-':`<span class="badge ${p>=80?'':p>=50?'gold':'rose'}">${p}%</span>`]}),
  us.length?empty('Tiada murid','Unit ini belum mempunyai ahli yang sepadan dengan penapis.'):empty('Belum ada unit dalam kategori ini','Tambah unit di Pengurusan & Admin.'))+`</div>`
}
function exportKeh(uid){
  const {M,byUnit}=stats(),ts=(byUnit.get(uid)||[]).slice().sort((a,b)=>a.bil-b.bil);
  downloadCsv(`kehadiran-${unitNm(uid)}.csv`,[['Nama','No. KP','Kelas',...ts.map(t=>'Bil '+t.bil),'Hadir','Peratus'],...membersOf(uid).slice().sort(byNama).map(m=>{const s=M.get(m.id);return [m.nama,m.nokp,kelasOf(m),...ts.map(t=>(t.hadir||[]).includes(m.id)?'Hadir':'Tidak hadir'),`${s.hadir}/${s.mtg}`,pctOf(s)??'']})])
}

  }catch(e){toast('Fail tidak dapat dibaca: '+e.message,'err');return}
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),al={nama:['nama','namamurid','name'],nokp:['nokp','nokadpengenalan','kp','nomborkp','ic','nokpmurid'],jantina:['jantina','gender','lp'],tingkatan:['tingkatan','tahun','darjah','tahuntingkatan'],kelas:['kelas','namakelas'],BB:['bb','badanberuniform'],KP:['kp2','kelab','kelabpersatuan','kelabdanpersatuan'],SP:['sp','sukan','sukanpermainan','sukandanpermainan'],RS:['rumah','rumahsukan','rs']};
  const hd=(rows[0]||[]).map(norm),col={};for(const k in al){let i=hd.findIndex(h=>al[k].includes(h));if(k==='KP'&&i<0){const seen=hd.indexOf('kp');if(seen>=0&&hd.indexOf('nokp')>=0)i=seen}col[k]=i}
  if(col.nama<0||col.nokp<0){toast('Lajur "nama" dan "nokp" diperlukan. Muat turun templat untuk rujukan.','err');return}
  const exist=new Map(S.murid.map(m=>[m.nokp,m])),out=[];let upd=0,skip=0;
  for(const r of rows.slice(1)){
    const nama=String(r[col.nama]||'').trim(),nokp=String(r[col.nokp]||'').trim().replace(/[-\s]/g,'');if(!nama||!nokp){skip++;continue}
    const jj=String(r[col.jantina]||'').trim().toUpperCase(),old=exist.get(nokp),u={...(old?.u||{})};
    for(const k of KK){if(col[k]>=0){const nm=String(r[col[k]]||'').trim().toUpperCase();if(nm){const un=S.unit.find(x=>x.kategori===k&&x.nama.toUpperCase()===nm);if(un)u[k]=un.id}}}
    if(old)upd++;out.push({...(old||{}),nama,nokp,jantina:jj[0]==='L'?'Lelaki':jj[0]==='P'?'Perempuan':(old?.jantina||''),tingkatan:col.tingkatan>=0?String(r[col.tingkatan]||'').trim():(old?.tingkatan||''),kelas:col.kelas>=0?String(r[col.kelas]||'').trim():(old?.kelas||''),u})
  }
  MS.imp=out;
  modal({title:'Sahkan import murid',body:`<p><b>${out.length-upd}</b> murid baharu dan <b>${upd}</b> murid sedia ada akan dikemas kini (dipadankan melalui No. KP).${skip?` ${skip} baris tanpa nama atau No. KP dilangkau.`:''}</p>${out.slice(0,5).map(o=>`<p class="mut" style="margin:2px 0">${esc(o.nama)} (${esc(o.nokp)})</p>`).join('')}${out.length>5?`<p class="mut">dan ${out.length-5} lagi</p>`:''}`,foot:`<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" ${out.length?'':'disabled'} onclick="closeModal();run(saveMany('murid',MS.imp),'Import selesai')">Import ${out.length} murid</button>`})
}
function admUnit(){
  const rs=S.unit.filter(u=>u.kategori==='RS').sort(byNama);
  return `<div class="stats">${rs.map(u=>`<div class="tile"><span class="i">${ic('home')}</span><div><b>${membersOf(u.id).length}</b><span>${esc(u.nama)}</span></div></div>`).join('')}</div><div class="card"><div class="tools"><div style="flex:1"></div><button class="btn" onclick="unitForm()">${ic('plus',16)}Tambah unit</button></div>`+
  tbl(['Unit','Kategori','Guru penasihat','c:Ahli',''],S.unit.slice().sort((a,b)=>KK.indexOf(a.kategori)-KK.indexOf(b.kategori)||byNama(a,b)).map(u=>[`<b>${esc(u.nama)}</b>`,kchip(u.kategori),esc((u.guruIds||[]).map(i=>get('guru',i)?.nama).filter(Boolean).join(', ')||'-'),membersOf(u.id).length,rowAct(`<button class="btn soft sm" onclick="unitAhli('${u.id}')">Urus ahli</button>`,ibtn(`unitForm('${u.id}')`,'edit','Edit'),ibtn(`delUnit('${u.id}')`,'trash','Padam'))]),empty('Belum ada unit','Tambah unit pertama, contohnya Pengakap atau Kelab Bahasa.',`<button class="btn" onclick="unitForm()">${ic('plus',16)}Tambah unit</button>`))+`</div>`
}
function unitForm(id){
  const u=id?get('unit',id):{guruIds:[]};
  modal({title:id?'Edit unit':'Tambah unit',body:`<form id="f" onsubmit="event.preventDefault();saveUnit('${id||''}')">${F('Nama unit *',tx('nama',u.nama||'',{req:1,ph:'Contoh: PENGAKAP'}))}${F('Kategori *',sel('kategori',katOpts(),u.kategori||'',{req:1}))}${F('Guru penasihat',`<div class="pick-list" style="max-height:150px">${guruOpts().map(([i,n])=>`<label class="pk"><input type="checkbox" name="guruIds" value="${i}"${(u.guruIds||[]).includes(i)?' checked':''}><span>${esc(n)}</span></label>`).join('')}</div>`)}</form>`,foot:`<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" form="f">Simpan unit</button>`})
}
function saveUnit(id){const f=readForm($('#f'));closeModal();run(save('unit',{...(id?get('unit',id):{}),nama:f.nama.trim(),kategori:f.kategori,guruIds:[].concat(f.guruIds||[])}),'Unit disimpan')}
function delUnit(id){const n=membersOf(id).length;ask(`Padam unit ${esc(unitNm(id))}?${n?` ${n} ahli akan kehilangan keahlian unit ini.`:''}`,async()=>{const u=get('unit',id),ch=S.murid.filter(m=>m.u?.[u.kategori]===id).map(m=>{const x={...m,u:{...m.u}};delete x.u[u.kategori];return x});await run(saveMany('murid',ch));run(remove('unit',id),'Unit dipadam')})}
function unitAhli(id){const u=get('unit',id);MS.unit=id;modal({title:'Urus ahli unit',sub:`${esc(u.nama)}. Murid yang dipilih akan dipindahkan daripada unit ${esc(KAT[u.kategori].n)} lain.`,wide:true,body:pickBody(mItems(S.murid),new Set(membersOf(id).map(m=>m.id))),foot:`<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveAhli()">Simpan ahli</button>`});pickCount()}
function saveAhli(){
  const id=MS.unit,u=get('unit',id),sel=new Set(pickIds()),ch=[];
  for(const m of S.murid){const cur=m.u?.[u.kategori],want=sel.has(m.id);if(want&&cur!==id)ch.push({...m,u:{...m.u,[u.kategori]:id}});else if(!want&&cur===id){const x={...m,u:{...m.u}};delete x.u[u.kategori];ch.push(x)}}
  closeModal();run(saveMany('murid',ch),`${ch.length} perubahan disimpan`)
}
function admGuru(){
  return `<div class="card"><div class="tools"><div style="flex:1"></div><button class="btn" onclick="guruForm()">${ic('plus',16)}Tambah guru</button></div>`+
  tbl(['Nama','No. KP','Peranan','Unit penasihat',''],S.guru.slice().sort(byNama).map(g=>[`<b>${esc(g.nama)}</b>`,esc(g.nokp||'-'),`<span class="badge ${g.peranan==='admin'?'gold':''}">${g.peranan==='admin'?'Pentadbir':'Guru'}</span>`,esc(S.unit.filter(u=>(u.guruIds||[]).includes(g.id)).map(u=>u.nama).join(', ')||'-'),rowAct(ibtn(`guruForm('${g.id}')`,'edit','Edit'),ibtn(`delGuru('${g.id}')`,'trash','Padam'))]),empty('Belum ada guru','Tambah guru supaya mereka boleh log masuk.'))+`</div>`
}
function guruForm(id){
  const g=id?get('guru',id):{peranan:'guru'};
  modal({title:id?'Edit guru':'Tambah guru',body:`<form id="f" onsubmit="event.preventDefault();saveGuru('${id||''}')">${F('Nama *',tx('nama',g.nama||'',{req:1}))}${F('No. KP',tx('nokp',g.nokp||''))}${F('Peranan',sel('peranan',[['guru','Guru'],['admin','Pentadbir']],g.peranan,{ph:null}))}${F(id?'Kata laluan baharu (kosongkan jika tidak diubah)':'Kata laluan sementara * (guru akan menukarnya semasa log masuk pertama)',`<input class="in" name="pw" type="password" minlength="6" autocomplete="new-password" ${id?'':'required'}>`)}</form>`,foot:`<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" form="f">Simpan guru</button>`})
}
async function saveGuru(id){
  const f=readForm($('#f')),o={...(id?get('guru',id):{}),nama:f.nama.trim(),nokp:f.nokp.trim(),peranan:f.peranan};
  if(id&&o.peranan!=='admin'&&S.guru.filter(g=>g.peranan==='admin'&&g.id!==id).length===0){toast('Mesti ada sekurang-kurangnya seorang pentadbir.','err');return}
  if(f.pw){o.salt=rnd();o.hash=await sha(o.salt+f.pw);o.tukar=true}
  closeModal();run(save('guru',o),'Guru disimpan')
}
function delGuru(id){
  if(id===ME.id){toast('Anda tidak boleh memadam akaun yang sedang digunakan.','err');return}
  if(get('guru',id).peranan==='admin'&&S.guru.filter(g=>g.peranan==='admin').length<2){toast('Mesti ada sekurang-kurangnya seorang pentadbir.','err');return}
  ask('Padam akaun guru ini?',()=>run(remove('guru',id),'Guru dipadam'))
}

/* ---------- carian pantas ---------- */
function openSearch(){
  modal({title:'Carian pantas',body:`<label class="srch">${ic('search',16)}<input id="qs-i" placeholder="Cari halaman, murid atau program…" oninput="qsRun(this.value)" onkeydown="if(event.key==='Enter'){const b=$('#qs-r button');if(b)b.click()}" autocomplete="off"></label><div class="qr" id="qs-r"></div>`});qsRun('')
}
function qsRun(v){
  v=v.toLowerCase().trim();const out=[];
  ROUTES.filter(r=>(!r.admin||ME.peranan==='admin')&&r.t.toLowerCase().includes(v)).forEach(r=>out.push([ic(r.i,16),r.t,'Halaman',`closeModal();location.hash='#/${r.id}'`]));
  if(v.length>1){
    S.murid.filter(m=>(m.nama+' '+m.nokp).toLowerCase().includes(v)).slice(0,6).forEach(m=>out.push([ic('users',16),esc(m.nama),'Murid',`profil('${m.id}')`]));
    S.program.filter(p=>p.nama.toLowerCase().includes(v)).slice(0,4).forEach(p=>out.push([ic('cal',16),esc(p.nama),'Program',`closeModal();ST.program={tab:'${p.status||'daftar'}',q:''};location.hash='#/program';schedule()`]));
  }
  $('#qs-r').innerHTML=out.length?out.map(o=>`<button onclick="${o[3]}">${o[0]}<span>${o[1]}</span><small>${o[2]}</small></button>`).join(''):'<p class="mut" style="padding:8px">Tiada hasil.</p>'
}

connect();
